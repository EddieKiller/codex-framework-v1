services:
  app:
    build: .
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      app:
        condition: service_healthy
